[package]
name = "cursor-drop"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sevenz-rust2 = "0.25.0"
unrar = "0.5.8"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Graphics_GdiPlus", "Win32_Graphics_Dwm", "Win32_Globalization", "Win32_System_Time", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_Storage_FileSystem", "Win32_System_Environment"] }
zip = { version = "9.7.0", default-features = false, features = ["deflate", "deflate64", "bzip2", "lzma"] }

[[bin]]
name = "CursorDrop"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
strip = true
